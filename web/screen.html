<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Service Screen</title>
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Arial}
    .wrap{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;gap:12px}
    .status{font-size:14px}
    .card{border:1px solid #ddd;border-radius:12px;padding:24px;min-width:480px}
    .row{display:flex;justify-content:space-between;margin:8px 0}
    .label{color:#666}
    .value{font-weight:600}
    .live{color:#0a0}
    .reconn{color:#c60}
  </style>
</head>
<body>
<div class="wrap">
  <div class="status"><span id="live" class="reconn">Connecting…</span></div>
  <div class="card">
    <div class="row"><div class="label">Customer</div><div class="value" id="v-customer">—</div></div>
    <div class="row"><div class="label">Plate</div><div class="value" id="v-plate">—</div></div>
    <div class="row"><div class="label">ETA</div><div class="value" id="v-eta">—</div></div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const segs = location.pathname.split('/').filter(Boolean);
  const screenId = segs[segs.length-1];
  const token = params.get('token');
   const apiBase = location.origin;

  async function loadCurrent(){
    try{
      const res = await fetch(`${apiBase}/screens/${screenId}/current`, { cache: 'no-store' });
      const data = await res.json();
      if (data?.payload) render(data.payload);
    }catch{}
  }

  function setStatus(ok){
    const el = document.getElementById('live');
    el.textContent = ok ? 'Live' : 'Reconnecting…';
    el.className = ok ? 'live' : 'reconn';
  }

  function render(p){
    document.getElementById('v-customer').textContent = p.customer || '—';
    document.getElementById('v-plate').textContent = p.plate || '—';
    document.getElementById('v-eta').textContent = p.eta || '—';
  }

  loadCurrent();
  const socket = io(apiBase, {
    // transports: ['websocket'],
    reconnection: true,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000,
    auth: { screenId, token }
  });

  socket.on('connect', () => setStatus(true));
  socket.on('disconnect', () => setStatus(false));
  socket.on('connect_error', () => setStatus(false));
  socket.on('screen:update', (msg) => { if (msg?.payload) render(msg.payload); });
})();
</script>
</body>
</html>
